<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copiloto Power BI — Iniciar sesión</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">

<div class="login-card">
    <div class="brand" style="justify-content:center;margin-bottom:18px">
        <div class="brand-mark">PBI</div>
        <div>
            <div class="brand-title">Copiloto Power BI</div>
            <div class="brand-sub">Ejecución Plan de Negocios</div>
        </div>
    </div>

    {% if error %}
    <p class="hero-error" style="margin-bottom:14px">{{ error }}</p>
    {% endif %}

    <form method="post" action="/login" class="login-form">
        <label class="login-label" for="username">Usuario</label>
        <input class="login-input" type="text" id="username" name="username" autocomplete="username" autofocus required>

        <label class="login-label" for="password">Contraseña</label>
        <input class="login-input" type="password" id="password" name="password" autocomplete="current-password" required>

        <button class="btn btn-primary btn-lg" type="submit" style="width:100%;justify-content:center;margin-top:18px">Entrar</button>
    </form>
</div>

</body>
</html>
